name: verify

# Cross-platform checks for the extension and the thesis tooling.
#
# One runtime (Bun) installs dependencies, runs the tests, typechecks and
# builds on both Ubuntu and Windows. No Python, npm or Node setup is needed.
# This workflow deliberately does NOT launch a browser: the recorded
# verification matrix (T01..T10) is run manually on the machine under test
# and its results are committed under results/verification/.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  extension:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Tests (extension + platform layer)
        run: bun test

      - name: Typecheck (extension + tooling)
        run: bun run typecheck

      - name: Build
        run: bun run build

      - name: Tool CLI smoke check (no browser launched)
        run: |
          bun scripts/cli.ts doctor
          bun tools/thesis-verify/verify.ts summary
