name: verify

# Cross-platform checks for the extension and the thesis tooling.
#
# This workflow deliberately does NOT launch a browser: the recorded
# verification matrix (T01..T10) needs a real Chrome and is run manually on
# the machine under test, with its results committed under
# results/verification/. Here we only prove that the code builds and that the
# platform layer behaves the same on Linux and Windows.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  extension:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Node tests (extension contracts)
        run: npm test

      - name: Typecheck and build
        run: npm run build

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install harness dependency
        run: python -m pip install websocket-client

      - name: Python syntax check
        run: >-
          python -m py_compile
          tools/thesis-verify/verify.py
          tools/thesis-verify/cdp.py
          tools/thesis-verify/platform_support.py
          tools/memory-bench/bench.py

      - name: Tool CLI smoke check (no browser launched)
        run: |
          python tools/thesis-verify/verify.py --help
          python tools/memory-bench/bench.py --help

      - name: Python unit tests (platform layer)
        run: python -m unittest discover -s tools/thesis-verify/tests -v
